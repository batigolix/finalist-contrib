<!DOCTYPE html>
<!-- AI generated -->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Finalist Drupal projecten — overzicht</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1600px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
    nav { margin-bottom: 1.5rem; }
    nav a {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      background: #f0f0f0;
      color: #333;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }
    nav a.current { background: #0074bd; color: white; }
    nav a:hover { background: #e0e0e0; }
    nav a.current:hover { background: #005f99; }
    a { color: #0074bd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    #filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: flex-end;
      flex-wrap: wrap;
    }
    #filters label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #555;
    }
    #filters select {
      padding: 0.35rem 0.5rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      min-width: 180px;
    }
    #filters button {
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
    }
    #filters button:hover { background: #f5f5f5; }
    .zero { color: #999; }
    .machine { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #777; }
    .kind {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
    }
    .kind-module       { background: #e7f0ff; color: #1e4a99; }
    .kind-theme        { background: #ffe7f0; color: #991e5a; }
    .kind-distribution { background: #fff4e0; color: #995a1e; }
    .kind-other        { background: #eee; color: #666; }
    .status-active      { color: #155724; }
    .status-minimal     { color: #a17400; }
    .status-seeking     { color: #b04040; }
    .status-unsupported { color: #999; text-decoration: line-through; }
    .security-covered    { color: #155724; font-size: 0.85rem; }
    .security-notcovered { color: #a02020; font-size: 0.85rem; }
    .maintainer {
      display: inline-block;
      padding: 1px 6px;
      background: #eef2f7;
      color: #445;
      border-radius: 3px;
      font-size: 0.8rem;
      margin: 1px 2px 1px 0;
    }
  </style>
</head>
<body>
  <h1>Finalist Drupal projecten</h1>
  <div class="meta" id="meta">Data laden...</div>

  <nav>
    <a href="projects.html" class="current">Projecten</a>
    <a href="issues.html">Open issues</a>
  </nav>

  <div id="filters">
    <label>
      Type
      <select id="filter-kind"><option value="">Alle types</option></select>
    </label>
    <label>
      Finalist maintainer
      <select id="filter-finalist"><option value="">Alle</option></select>
    </label>
    <label>
      Maintenance status
      <select id="filter-maintenance"><option value="">Alle statussen</option></select>
    </label>
    <label>
      Open issues
      <select id="filter-issues">
        <option value="">Alle</option>
        <option value=">0">Met open issues</option>
        <option value="=0">Zonder open issues</option>
      </select>
    </label>
    <button id="filter-clear" type="button">Filters wissen</button>
  </div>

  <div id="table"></div>

  <script src="projects.js"></script>
  <script src="https://unpkg.com/gridjs/dist/gridjs.production.min.js"></script>
  <script>
    (function () {
      const data = window.projectsData;
      if (!data) {
        document.getElementById('meta').textContent =
          'FOUT: projects.js niet gevonden of leeg. Run update-issues.sh eerst.';
        return;
      }

      const gen = new Date(data.generated_at);
      document.getElementById('meta').textContent =
        `${data.projects_count} projecten · ${data.issues_count} open issues · gegenereerd ${gen.toLocaleString('nl-NL')}`;

      // Default sort: most open issues first.
      const allProjects = data.projects.slice().sort((a, b) => b.open_issues - a.open_issues);

      // Populate filter dropdowns from unique values.
      const kindSelect     = document.getElementById('filter-kind');
      const finalistSelect = document.getElementById('filter-finalist');
      const statSelect     = document.getElementById('filter-maintenance');

      [...new Set(allProjects.map(p => p.kind))].sort().forEach(k => {
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = k;
        kindSelect.appendChild(opt);
      });
      [...new Set(allProjects.flatMap(p => p.finalist_maintainers || []))].sort().forEach(u => {
        const opt = document.createElement('option');
        opt.value = u; opt.textContent = u;
        finalistSelect.appendChild(opt);
      });
      [...new Set(allProjects.map(p => p.maintenance_status).filter(Boolean))].sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        statSelect.appendChild(opt);
      });

      // Formatting helpers.
      function kindBadge(k) {
        const cls = ['module', 'theme', 'distribution'].includes(k) ? `kind-${k}` : 'kind-other';
        return `<span class="kind ${cls}">${k}</span>`;
      }
      function statusClass(s) {
        if (!s) return '';
        if (s.includes('Actively'))    return 'status-active';
        if (s.includes('Minimally'))   return 'status-minimal';
        if (s.includes('Seeking'))     return 'status-seeking';
        if (s.includes('Unsupported')) return 'status-unsupported';
        return '';
      }
      function securityLabel(v) {
        if (v === 'covered')     return '<span class="security-covered" title="Covered by security advisory policy">✓ covered</span>';
        if (v === 'not-covered') return '<span class="security-notcovered" title="Not covered by SA policy">not covered</span>';
        return '';
      }

      const grid = new gridjs.Grid({
        columns: [
          {
            id: 'title',
            name: 'Project',
            formatter: (v, row) => gridjs.html(
              `<a href="${row.cells[5].data}" target="_blank" rel="noopener">${v}</a>`
            )
          },
          {
            id: 'kind',
            name: 'Type',
            width: '120px',
            formatter: (v) => gridjs.html(kindBadge(v))
          },
          {
            id: 'latest_version',
            name: 'Versie',
            width: '110px',
            formatter: (v) => v || gridjs.html('<span class="zero">—</span>')
          },
          {
            id: 'maintenance_status',
            name: 'Maintenance',
            width: '160px',
            formatter: (v) => gridjs.html(`<span class="${statusClass(v)}">${v || ''}</span>`)
          },
          {
            id: 'security_coverage',
            name: 'Security',
            width: '110px',
            formatter: (v) => gridjs.html(securityLabel(v))
          },
          { id: 'url', hidden: true },
          { id: 'machine_name', hidden: true },
          {
            id: 'open_issues',
            name: 'Open issues',
            width: '110px',
            formatter: (v, row) => {
              if (v === 0) return gridjs.html('<span class="zero">0</span>');
              const slug = row.cells[6].data;
              return gridjs.html(`<a href="issues.html#project=${encodeURIComponent(slug)}">${v}</a>`);
            }
          },
          {
            id: 'finalist_maintainers',
            name: 'Finalist maintainers',
            sort: { compare: (a, b) => (a?.length || 0) - (b?.length || 0) },
            formatter: (v) => {
              if (!v || v.length === 0) return '';
              return gridjs.html(v.map(u => `<span class="maintainer">${u}</span>`).join(' '));
            }
          },
        ],
        data: allProjects,
        sort: true,
        search: { placeholder: 'Zoek in project-namen...' },
        pagination: { limit: 25, summary: true },
        language: {
          search: { placeholder: 'Zoek in project-namen...' },
          pagination: {
            previous: 'Vorige', next: 'Volgende',
            showing: 'Toont', of: 'van', to: 'tot', results: 'projecten'
          },
          noRecordsFound: 'Geen projecten gevonden',
        }
      }).render(document.getElementById('table'));

      // Filter logic.
      function applyFilters() {
        const k = kindSelect.value;
        const f = finalistSelect.value;
        const s = statSelect.value;
        const i = document.getElementById('filter-issues').value;
        const filtered = allProjects.filter(p => {
          if (k && p.kind !== k) return false;
          if (f && !(p.finalist_maintainers || []).includes(f)) return false;
          if (s && p.maintenance_status !== s) return false;
          if (i === '>0' && p.open_issues === 0) return false;
          if (i === '=0' && p.open_issues > 0) return false;
          return true;
        });
        grid.updateConfig({ data: filtered }).forceRender();
      }

      [kindSelect, finalistSelect, statSelect, document.getElementById('filter-issues')]
        .forEach(el => el.addEventListener('change', applyFilters));
      document.getElementById('filter-clear').addEventListener('click', () => {
        [kindSelect, finalistSelect, statSelect, document.getElementById('filter-issues')]
          .forEach(el => el.value = '');
        applyFilters();
      });
    })();
  </script>
</body>
</html>
