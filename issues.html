<!DOCTYPE html>
<!-- AI generated -->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Finalist Drupal modules — open issues</title>
  <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #222;
    }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; font-size: 0.9rem; margin-bottom: 1.5rem; }
    a { color: #0074bd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { margin-bottom: 1.5rem; }
    nav a {
      display: inline-block;
      padding: 0.4rem 0.8rem;
      background: #f0f0f0;
      color: #333;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-right: 0.5rem;
    }
    nav a.current { background: #0074bd; color: white; }
    nav a:hover { background: #e0e0e0; }
    nav a.current:hover { background: #005f99; }
    #filters {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }
    #filters label {
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
      color: #555;
    }
    #filters select {
      padding: 0.35rem 0.5rem;
      font-size: 0.95rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      min-width: 180px;
    }
    #filters button {
      padding: 0.4rem 0.8rem;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      align-self: flex-end;
    }
    #filters button:hover { background: #f5f5f5; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: normal;
      line-height: 1.3;
    }
    .status-active      { background: #e8f4ff; color: #005599; }
    .status-needsreview { background: #fff4cc; color: #664e00; }
    .status-needswork   { background: #ffe0e0; color: #a02020; }
    .status-rtbc        { background: #d4edda; color: #155724; }
    .status-postponed   { background: #eee; color: #666; }
    .status-closed      { background: #f5f5f5; color: #999; }
    .zero    { color: #999; }
    .machine { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Open issues — Finalist Drupal projecten</h1>
  <div class="meta" id="meta">Data laden...</div>

  <nav>
    <a href="projects.html">Projecten</a>
    <a href="issues.html" class="current">Open issues</a>
  </nav>

  <div id="filters">
    <label>
      Project
      <select id="filter-project"><option value="">Alle projecten</option></select>
    </label>
    <label>
      Status
      <select id="filter-status"><option value="">Alle statussen</option></select>
    </label>
    <button id="filter-clear" type="button">Filters wissen</button>
  </div>

  <div id="table"></div>

  <script src="issues.js"></script>
  <script src="https://unpkg.com/gridjs/dist/gridjs.production.min.js"></script>
  <script>
    (function () {
      const data = window.issuesData;
      if (!data) {
        document.getElementById('meta').textContent =
          'FOUT: issues.js niet gevonden of leeg. Run update-issues.sh eerst.';
        return;
      }

      // Default sort: newest "changed" first (ISO strings sort correctly).
      const allIssues = data.issues.slice().sort((a, b) => b.changed.localeCompare(a.changed));
      const gen = new Date(data.generated_at);
      document.getElementById('meta').textContent =
        `${data.issues_count} open issues in ${data.projects_count} projecten · gegenereerd ${gen.toLocaleString('nl-NL')}`;

      // ── Populate dropdowns with unique values ───────────────────────
      const projectSelect = document.getElementById('filter-project');
      const statusSelect  = document.getElementById('filter-status');

      // Value = machine_name (URL-safe), label = display title.
      const projectPairs = [...new Map(
        allIssues.map(i => [i.project, i.project_title])
      )].sort((a, b) => a[1].localeCompare(b[1]));
      projectPairs.forEach(([slug, title]) => {
        const opt = document.createElement('option');
        opt.value = slug; opt.textContent = title;
        projectSelect.appendChild(opt);
      });
      [...new Set(allIssues.map(i => i.status_label))].sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        statusSelect.appendChild(opt);
      });

      // Preselect from URL hash: #project=<slug>
      const hashParams = new URLSearchParams(location.hash.slice(1));
      const initialProject = hashParams.get('project');
      if (initialProject) projectSelect.value = initialProject;

      // ── Format helpers ─────────────────────────────────────────────
      const statusClass = {
        'Active':                              'status-active',
        'Needs review':                        'status-needsreview',
        'Needs work':                          'status-needswork',
        'Reviewed & tested by the community':  'status-rtbc',
        'Postponed':                           'status-postponed',
        'Postponed (maintainer needs more info)': 'status-postponed',
        'Patch (to be ported)':                'status-postponed',
      };

      function fmtDate(iso) {
        return iso.slice(0, 10);
      }

      // ── Grid ───────────────────────────────────────────────────────
      const grid = new gridjs.Grid({
        columns: [
          {
            id: 'project_title',
            name: 'Project',
            width: '180px',
            formatter: (v, row) => {
              const slug = row.cells[1].data;
              return gridjs.html(
                `<a href="https://www.drupal.org/project/${slug}" target="_blank" rel="noopener">${v}</a>`
              );
            }
          },
          { id: 'project', hidden: true },
          {
            id: 'status_label',
            name: 'Status',
            width: '180px',
            formatter: (v) => gridjs.html(
              `<span class="badge ${statusClass[v] || 'status-closed'}">${v}</span>`
            )
          },
          {
            id: 'title',
            name: 'Titel',
            formatter: (v, row) => {
              const url = row.cells[4].data;
              return gridjs.html(
                `<a href="${url}" target="_blank" rel="noopener">${v}</a>`
              );
            }
          },
          { id: 'url', hidden: true },
          {
            id: 'version',
            name: 'Versie',
            width: '130px',
            formatter: (v) => v
              ? gridjs.html(`<span class="machine">${v}</span>`)
              : gridjs.html('<span class="zero">—</span>')
          },
          {
            id: 'changed',
            name: 'Gewijzigd',
            width: '120px',
            formatter: (v) => gridjs.html(
              `<span title="${v}">${fmtDate(v)}</span>`
            )
          },
        ],
        data: allIssues,
        sort: true,
        search: { placeholder: 'Zoek in titels...' },
        pagination: { limit: 25, summary: true },
        language: {
          search: { placeholder: 'Zoek in titels...' },
          pagination: {
            previous: 'Vorige', next: 'Volgende',
            showing: 'Toont', of: 'van', to: 'tot', results: 'issues'
          },
          noRecordsFound: 'Geen issues gevonden',
        }
      }).render(document.getElementById('table'));

      // ── Filter logic ────────────────────────────────────────────────
      function applyFilters() {
        const p = projectSelect.value;
        const s = statusSelect.value;
        const filtered = allIssues.filter(i =>
          (!p || i.project === p) && (!s || i.status_label === s)
        );
        grid.updateConfig({ data: filtered }).forceRender();
      }

      projectSelect.addEventListener('change', applyFilters);
      statusSelect.addEventListener('change', applyFilters);
      document.getElementById('filter-clear').addEventListener('click', () => {
        projectSelect.value = '';
        statusSelect.value = '';
        applyFilters();
      });

      // Apply initial filter from URL hash.
      if (initialProject) applyFilters();
    })();
  </script>
</body>
</html>
